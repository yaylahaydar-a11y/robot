name: firebot_control
description: Professional FireBot Robot Control Application
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Bluetooth Connectivity
  flutter_bluetooth_serial: ^0.4.0

  # State Management
  provider: ^6.1.1

  # Runtime permissions (Android 12+ Bluetooth)
  permission_handler: ^12.0.1

  # UI Enhancements
  font_awesome_flutter: ^10.7.0
  animated_text_kit: ^4.2.2

  # Utilities (vibration removed)
  fluttertoast: ^8.2.4
  shared_preferences: ^2.2.2

  # Additional UI
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/